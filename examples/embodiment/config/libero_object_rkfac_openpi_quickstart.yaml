# RK-FAC (Residual-Kinetic Flow Actor-Critic) quickstart for LIBERO Object with OpenPi (π0)
# Based on libero_object_flownft_openpi_quickstart.yaml, adapted for RK-FAC.
#
# Key differences from FlowNFT:
# - loss_type: flow_rkfac (actor-critic with residual kinetic energy trust region)
# - Frozen-VLM Q-network: Q gradient doesn't backprop to VLM → OOD robust
# - Q-gradient through ODE: step-level temporal credit via differentiable Euler ODE
# - No NFT SDE snapshots needed (standard ODE sampling + vlm_embedding collection)
# - Automatic temperature α tuning via Lagrangian dual on E_res target

defaults:
  - env/libero_object@env.train
  - env/libero_object@env.eval
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_object_rkfac_openpi"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 200

  resume_dir: null
  ckpt_path: null

algorithm:
  # ==================== RK-FAC Core ====================
  loss_type: flow_rkfac
  adv_type: gae                        # not used by RK-FAC, kept for compatibility

  # RK-FAC hyperparameters
  rkfac_alpha_init: 0.1                # initial temperature α
  rkfac_alpha_lr: 3.0e-4               # α learning rate
  rkfac_e_tgt: 1.0                     # target residual kinetic energy (C × d_a)
  rkfac_gamma: 0.99                    # TD discount factor
  rkfac_tau: 0.005                     # target Q-network EMA rate
  rkfac_q_lr: 1.0e-4                   # Q-network learning rate
  rkfac_q_hidden_dims: [512, 256, 128] # Q MLP hidden layers
  rkfac_actor_delay: 2                 # critic updates per actor update
  rkfac_num_ode_steps: 2              # ODE steps K for actor update (2 saves memory; increase to 4 if GPU allows)
  rkfac_grad_clip: 1.0                 # gradient clipping for Q-network
  rkfac_vlm_hidden: 2048               # VLM embedding dimension (PaliGemma)

  # ==================== General ====================
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 4
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 64
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    single_task_id: null
  eval:
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    single_task_id: null
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "/DATA/disk1/yjb/projects/VLA/FlowIPO/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16                 # reduced from 64 for RK-FAC ODE memory (K suffix forwards per step)
  global_batch_size: 256               # reduced accordingly to keep gradient accumulation reasonable
  seed: 42
  enable_offload: True
  model:
    model_path: "/DATA/disk1/yjb/projects/VLA/FlowIPO/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    num_action_chunks: 5
    add_value_head: False              # RK-FAC uses independent Q-network, no value head
    openpi:
      detach_critic_input: False
      use_nft_loss: False              # RK-FAC does not use NFT snapshots
      collect_vlm_embedding: True      # collect pooled VLM embedding for Q input
      noise_method: flow_sde           # standard ODE sampling for rollout

  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
