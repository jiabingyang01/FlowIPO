# GFN-Flow quickstart configuration for LIBERO Object tasks with OpenPi (π0)
# GFlowNet-guided denoising for diversity-preserving RL of flow-based VLAs.
# Core idea: model K-step denoising as a GFlowNet DAG, train with SubTB loss.
#   π(a|s) ∝ R(a,s) — preserves action diversity while improving performance.
# Key difference from FPI/AWM: no advantage weighting, uses flow balance instead.

defaults:
  - env/libero_object@env.train
  - env/libero_object@env.eval
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_object_flowgfn_kl0.5_openpi_quickstart"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 200

  resume_dir: null
  ckpt_path: null

algorithm:
  # ==================== GFN-Flow Core ====================
  loss_type: flow_gfn
  adv_type: gae                       # not used, kept for compatibility

  # GFN-Flow hyperparameters
  flow_gfn_denoise_steps: 4           # K: DAG depth (number of denoising steps)
  flow_gfn_sigma_f: 0.1              # forward policy noise σ_f
  flow_gfn_sigma_b: 0.1              # backward policy noise σ_b
  flow_gfn_subtb_lambda: 1.0         # SubTB geometric weighting (λ^length)
  flow_gfn_boundary_coeff: 1.0       # boundary loss weight (log F(s_K) - log R)²
  flow_gfn_kl_coeff: 0.5             # trust region ||v_θ - v_old||² coefficient
  flow_gfn_flow_loss_coeff: 1.0      # SubTB + boundary loss coefficient
  flow_gfn_ema_beta: 0.995           # EMA decay for chain generation model
  flow_gfn_warmup: 5                 # warmup epochs (pure BC, only train F_ψ)
  flow_gfn_reward_floor: 0.01        # floor reward ε (GFN requires R > 0)
  flow_gfn_t_min: 0.0                # flow time sampling min for trust region
  flow_gfn_t_max: 1.0                # flow time sampling max for trust region

  # ==================== General ====================
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 4
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 32
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    single_task_id: 0               # train on task 0 only, set to null for all tasks
  eval:
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    single_task_id: 0               # eval on task 0 only, set to null for all tasks
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "/DATA/disk1/yjb/projects/VLA/FlowIPO/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16                # GFN needs K+2=6 suffix forwards (vs 1 for AWM), reduce batch
  global_batch_size: 512
  seed: 42
  enable_offload: True
  model:
    model_path: "/DATA/disk1/yjb/projects/VLA/FlowIPO/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    num_action_chunks: 5
    add_value_head: False             # GFN does NOT need value head V(o,l)
    add_state_flow_net: True          # ENABLE State Flow Network F_ψ
    openpi:
      value_after_vlm: False          # N/A for GFN
      detach_critic_input: True       # prevent F_ψ gradients from corrupting action expert

  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4                  # learning rate for F_ψ parameters
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: True       # GFN has K+2 suffix forwards, need checkpointing to fit
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
