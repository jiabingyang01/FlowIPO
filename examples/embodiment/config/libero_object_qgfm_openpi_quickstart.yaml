# QGFM (Q-Guided Flow Matching) quickstart for LIBERO Object with OpenPi (π0)
#
# QGFM perturbs the flow matching target action with Q-gradient:
#   a' = a + η · ∇_a Q(s, a) / ||∇_a Q||   (normalized Q-gradient perturbation)
#   L = ||v_θ(x_t, t | s) - (ε - a')||²     (standard FM loss with perturbed target)
#
# Key differences from RK-FAC:
# - No ODE loop during training (uses standard ForwardType.VELOCITY — 1 prefix + 1 suffix)
# - No weight swap / frozen expert (Q-gradient perturbs target, not ODE chain)
# - No learnable α (η schedule replaces temperature tuning)
# - Much lower memory: no gradient checkpointing needed
# - Actor loss is standard flow matching MSE (not α·E_res - Q)

defaults:
  - env/libero_object@env.train
  - env/libero_object@env.eval
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_object_qgfm_openpi"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 500

  resume_dir: null
  ckpt_path: null

algorithm:
  # ==================== QGFM Core ====================
  loss_type: flow_qgfm
  adv_type: gae                        # not used by QGFM, kept for compatibility

  # QGFM hyperparameters
  qgfm_eta_init: 0.0001                # initial perturbation step size (very small = near BC)
  qgfm_eta_max: 0.005                  # max perturbation step size (conservative, ramp up slowly)
  qgfm_eta_warmup_iters: 200           # iterations to linearly ramp η (200 micro-batch ≈ 25 rollout steps)
  qgfm_q_warmup_iters: 200             # pure BC while Q bootstraps (200 micro-batches ≈ 25 rollout steps)
  qgfm_lam_bc: 0.5                     # BC regularization weight: loss = (1-lam)*||v-u'||² + lam*||v-u||²
  qgfm_gamma: 0.99                     # TD discount factor
  qgfm_tau: 0.005                      # target Q-network EMA rate
  qgfm_q_lr: 1.0e-4                    # Q-network learning rate
  qgfm_q_hidden_dims: [512, 256, 128]  # Q MLP hidden layers
  qgfm_actor_delay: 1                  # actor updates per critic update (1 = every step)
  qgfm_grad_clip: 1.0                  # gradient clipping for Q-network
  qgfm_vlm_hidden: 2048                # VLM embedding dimension (PaliGemma)
  qgfm_norm_q_grad: True               # normalize ∇_a Q to unit direction

  # ==================== General ====================
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 4                       # multi-epoch: QGFM uses standard BC, safe for multiple epochs
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 64
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    single_task_id: null
  eval:
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    single_task_id: null
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "/DATA/disk1/yjb/projects/VLA/FlowIPO/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64                  # QGFM uses standard VELOCITY forward (no ODE loop), same as FlowIPO
  global_batch_size: 512
  seed: 42
  enable_offload: True
  model:
    model_path: "/DATA/disk1/yjb/projects/VLA/FlowIPO/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    num_action_chunks: 5
    add_value_head: False               # QGFM uses independent Q-network, no value head
    openpi:
      detach_critic_input: False
      use_nft_loss: False               # QGFM does not use NFT snapshots
      collect_vlm_embedding: True       # collect pooled VLM embedding for Q input
      noise_method: flow_sde            # standard ODE sampling for rollout

  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
