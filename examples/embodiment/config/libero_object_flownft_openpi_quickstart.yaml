# FlowNFT (π-StepNFT) quickstart configuration for LIBERO Object tasks with OpenPi (π0)
# Based on libero_object_flowsar_openpi_quickstart.yaml, adapted for FlowNFT.
#
# Key differences from FlowSAR:
# - loss_type: flow_nft (contrastive mirror + sample-space Mahalanobis energy)
# - No EMA annotation pass needed (data from rollout SDE chain)
# - No value network needed (terminal binary or FEA advantage)
# - noise_level: 0.2 (SDE exploration noise, lower than FlowSAR default)

defaults:
  - env/libero_object@env.train
  - env/libero_object@env.eval
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_object_flownft_openpi"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 200

  resume_dir: null
  ckpt_path: null

algorithm:
  # ==================== FlowNFT Core ====================
  loss_type: flow_nft
  adv_type: gae                      # not used by NFT, kept for compatibility

  # NFT hyperparameters (π-StepNFT paper defaults)
  flow_nft_beta: 1.0                 # mirror construction scale β
  flow_nft_kl_beta: 0.0001           # KL trust region weight (small, max_drift is main constraint)
  flow_nft_max_drift: 0.5            # velocity drift clipping (critical stability param)
  flow_nft_dpo_beta: 1.0             # DPO loss temperature
  flow_nft_noise_level: 0.2          # SDE exploration noise
  flow_nft_adv_clip_max: 1.0         # advantage clipping magnitude
  flow_nft_adv_type: terminal_binary  # "terminal_binary" (推荐) or "frozen_embedding" (不推荐, 详见docs)

  # FEA settings (only used when flow_nft_adv_type=frozen_embedding)
  flow_nft_fea_gamma: 0.99           # temporal discount for FEA
  flow_nft_fea_ridge_lambda: 1.0     # ridge regression regularization

  # ==================== General ====================
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 4
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 64
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    single_task_id: null               # train on task 0 only, set to null for all tasks
  eval:
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    single_task_id: null               # eval on task 0 only, set to null for all tasks
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "/DATA/disk1/yjb/projects/VLA/FlowIPO/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 512
  seed: 42
  enable_offload: True
  model:
    model_path: "/DATA/disk1/yjb/projects/VLA/FlowIPO/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    num_action_chunks: 5
    add_value_head: False             # FlowNFT: no critic needed
    openpi:
      detach_critic_input: False
      use_nft_loss: True              # enable NFT snapshot collection
      noise_method: flow_sde          # must be flow_sde for NFT
      noise_level: 0.2                # SDE noise level (matches flow_nft_noise_level)

  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
